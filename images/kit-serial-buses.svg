<rect x="650" y="370" width="170" height="62" rx="8" fill="#1C6B49" fill-opacity="0.10" stroke="#1C6B49" stroke-width="2"/>
<text x="735.0" y="398.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A2420">ATECC608A</text>
