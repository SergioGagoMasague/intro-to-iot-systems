<text x="460.0" y="215" text-anchor="middle" font-size="15" fill="#1A2420">One 8N1 frame = 10 bit times · data sent least-significant bit first</text>
<text x="460.0" y="240" text-anchor="middle" font-size="14" fill="#1C6B49">Data bits D0–D7 = 0x41 (ASCII ‘A’)</text>
<text x="460.0" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A2420">UART frame for the character ‘A’ (8 data bits, no parity, 1 stop bit)</text>
