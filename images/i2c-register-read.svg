<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 190" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="640.0" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A2420">Reading one register over I²C (MPU-6050 WHO_AM_I)</text>
<rect x="30" y="55" width="60" height="50" fill="#9E3629" fill-opacity="0.12" stroke="#9E3629" stroke-width="2"/>
<text x="60.0" y="87" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#1A2420">S</text>
<text x="60.0" y="125" text-anchor="middle" font-size="12" fill="#9E3629">START</text>
<rect x="90" y="55" width="180" height="50" fill="#1C6B49" fill-opacity="0.12" stroke="#1C6B49" stroke-width="2"/>
<text x="180.0" y="87" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#1A2420">1101000</text>
<text x="180.0" y="125" text-anchor="middle" font-size="12" fill="#1C6B49">7-bit address 0x68</text>
<rect x="270" y="55" width="70" height="50" fill="#8F5119" fill-opacity="0.12" stroke="#8F5119" stroke-width="2"/>
<text x="305.0" y="87" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#1A2420">W</text>
<text x="305.0" y="125" text-anchor="middle" font-size="12" fill="#8F5119">R/W = 0</text>
<rect x="340" y="55" width="50" height="50" fill="#6b7280" fill-opacity="0.12" stroke="#6b7280" stroke-width="2"/>
<text x="365.0" y="87" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#1A2420">A</text>
<text x="365.0" y="125" text-anchor="middle" font-size="12" fill="#6b7280">ACK</text>
<rect x="390" y="55" width="140" height="50" fill="#1A2420" fill-opacity="0.12" stroke="#1A2420" stroke-width="2"/>
<text x="460.0" y="87" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#1A2420">0x75</text>
<text x="460.0" y="125" text-anchor="middle" font-size="12" fill="#1A2420">register address</text>
<rect x="530" y="55" width="50" height="50" fill="#6b7280" fill-opacity="0.12" stroke="#6b7280" stroke-width="2"/>
<text x="555.0" y="87" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#1A2420">A</text>
<text x="555.0" y="125" text-anchor="middle" font-size="12" fill="#6b7280">ACK</text>
<rect x="580" y="55" width="110" height="50" fill="#9E3629" fill-opacity="0.12" stroke="#9E3629" stroke-width="2"/>
<text x="635.0" y="87" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#1A2420">Sr</text>
<text x="635.0" y="125" text-anchor="middle" font-size="12" fill="#9E3629">repeated START</text>
<rect x="690" y="55" width="180" height="50" fill="#1C6B49" fill-opacity="0.12" stroke="#1C6B49" stroke-width="2"/>
<text x="780.0" y="87" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#1A2420">1101000</text>
<text x="780.0" y="125" text-anchor="middle" font-size="12" fill="#1C6B49">address 0x68</text>
<rect x="870" y="55" width="70" height="50" fill="#8F5119" fill-opacity="0.12" stroke="#8F5119" stroke-width="2"/>
<text x="905.0" y="87" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#1A2420">R</text>
<text x="905.0" y="125" text-anchor="middle" font-size="12" fill="#8F5119">R/W = 1</text>
<rect x="940" y="55" width="50" height="50" fill="#6b7280" fill-opacity="0.12" stroke="#6b7280" stroke-width="2"/>
<text x="965.0" y="87" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#1A2420">A</text>
<text x="965.0" y="125" text-anchor="middle" font-size="12" fill="#6b7280">ACK</text>
<rect x="990" y="55" width="140" height="50" fill="#1C6B49" fill-opacity="0.12" stroke="#1C6B49" stroke-width="2"/>
<text x="1060.0" y="87" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#1A2420">0x68</text>
<text x="1060.0" y="125" text-anchor="middle" font-size="12" fill="#1C6B49">data from device</text>
<rect x="1130" y="55" width="60" height="50" fill="#6b7280" fill-opacity="0.12" stroke="#6b7280" stroke-width="2"/>
<text x="1160.0" y="87" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#1A2420">N</text>
<text x="1160.0" y="125" text-anchor="middle" font-size="12" fill="#6b7280">NACK</text>
<rect x="1190" y="55" width="60" height="50" fill="#9E3629" fill-opacity="0.12" stroke="#9E3629" stroke-width="2"/>
<text x="1220.0" y="87" text-anchor="middle" font-size="16" font-family="Menlo, monospace" fill="#1A2420">P</text>
<text x="1220.0" y="125" text-anchor="middle" font-size="12" fill="#9E3629">STOP</text>
<text x="30" y="170" font-size="13" fill="#6b7280">The controller drives START, both address bytes, R/W, the register address, NACK and STOP. The target drives each ACK and the data byte.</text>
</svg>