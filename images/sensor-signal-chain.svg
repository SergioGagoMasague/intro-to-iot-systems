<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 200" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A2420"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="565.0" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A2420">The sensor signal chain</text>
