<line x1="795" y1="105" x2="820" y2="105" stroke="#1A2420" stroke-width="2" marker-end="url(#ar)"/>
<rect x="820" y="70" width="135" height="70" rx="8" fill="#8F5119" fill-opacity="0.10" stroke="#8F5119" stroke-width="2"/>
<text x="887.5" y="101.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A2420">Interface</text>
