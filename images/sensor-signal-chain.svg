<line x1="315" y1="105" x2="340" y2="105" stroke="#1A2420" stroke-width="2" marker-end="url(#ar)"/>
<rect x="340" y="70" width="135" height="70" rx="8" fill="#1C6B49" fill-opacity="0.10" stroke="#1C6B49" stroke-width="2"/>
