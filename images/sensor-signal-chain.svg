<text x="567.5" y="101.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A2420">ADC</text>
<text x="567.5" y="120.0" text-anchor="middle" font-size="12" fill="#1A2420">→ number</text>
<line x1="635" y1="105" x2="660" y2="105" stroke="#1A2420" stroke-width="2" marker-end="url(#ar)"/>
